[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sci-verifier-mcp"
version = "0.1.0"
description = "Modular MCP server for verifying scientific equations, derivations, formal proofs, crystal structures, and citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SciVerifier Team" }
]
dependencies = [
    "mcp>=1.2.0",
    "sympy>=1.13.0",
    "pint>=0.24",
    "z3-solver>=4.13.0",
    "httpx>=0.27.0",
    "bibtexparser>=2.0.0",
    "antlr4-python3-runtime>=4.11,<4.12",
    "pydantic>=2.7.0",
    "spglib>=2.0.0",
    "pymatgen>=2024.1.1",
    "ase>=3.22.0",
    "mp-api>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
sci-verifier-mcp = "sci_verifier_mcp.server:main"
sci-verifier-config = "sci_verifier_mcp.installer:run_installer_cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: marks tests that connect to external live APIs",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
