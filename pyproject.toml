[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sci-verifier-mcp"
version = "0.1.0"
description = "Modular MCP server for verifying scientific equations, derivations, formal proofs, crystal structures, and citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SciVerifier Team" }
]
dependencies = [
    "mcp>=1.2.0",
    "sympy>=1.13.0",
    "pint>=0.24",
    "z3-solver>=4.13.0",
    "httpx>=0.27.0",
    "bibtexparser>=2.0.0",
    "antlr4-python3-runtime>=4.11",
    "pydantic>=2.7.0",
    "spglib>=2.0.0",
    "pymatgen>=2024.1.1",
    "ase>=3.22.0",
    "mp-api>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
sci-verifier-mcp = "sci_verifier_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that connect to external live APIs",
]
